<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MultiQuest</title>
  <meta name="description" content="Jogo de tabuleiro de perguntas para 2 a 6 jogadores / Quiz board game for 2 to 6 players">
  <meta name="theme-color" content="#1f4e9c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MultiQuest">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="default">
  <div id="decor" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🎲</span>
      <div>
        <h1>MultiQuest</h1>
        <p class="tagline" data-i18n="subtitle"></p>
      </div>
    </div>
    <div class="top-actions">
      <div class="lang" role="group" data-i18n-aria="language">
        <button type="button" class="lang-btn" data-lang="pt">PT</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
      <button type="button" class="ghost" id="rulesBtn" data-i18n="rules"></button>
      <button type="button" class="ghost hidden" id="newGameBtn" data-i18n="newGame"></button>
    </div>
  </header>

  <main>
    <!-- Setup -->
    <section id="setup" class="screen">
      <div class="card setup-card">
        <h2 data-i18n="setupTitle"></h2>
        <div class="field">
          <span class="label" data-i18n="numPlayers"></span>
          <div class="count-picker" id="countPicker"></div>
        </div>
        <div class="carousel">
          <div id="playerRows" class="player-rows"></div>
        </div>
        <div class="carousel-nav" id="carouselNav">
          <button type="button" class="nav-btn" id="prevPlayer" data-i18n-aria="prevPlayer" data-i18n-title="prevPlayer">‹</button>
          <div class="dots" id="playerDots"></div>
          <button type="button" class="nav-btn next" id="nextPlayer"><span data-i18n="nextPlayer"></span> ›</button>
        </div>
        <button type="button" class="primary big" id="startBtn" data-i18n="start"></button>
      </div>
    </section>

    <!-- Game: board fills the screen, current player + die at the bottom -->
    <section id="game" class="screen hidden">
      <div class="trap-banner hidden" id="trapBanner" role="status">
        <span data-i18n="pickTrapSquare"></span>
        <button type="button" class="ghost" id="trapCancel" data-i18n="cancel"></button>
      </div>
      <div class="board-area" id="boardArea">
        <div class="board-wrap" id="boardWrap">
          <div id="board" class="board"></div>
          <div id="tokens" class="tokens"></div>
        </div>
      </div>
      <div class="bottombar" id="turnCard">
        <div class="turn-avatar" id="turnAvatar"></div>
        <div class="turn-info">
          <div class="turn-line">
            <span class="turn-name" id="turnName"></span>
            <span class="turn-pos" id="turnPos"></span>
            <span class="diff-badge" id="turnDiff"></span>
            <span class="energy" id="turnEnergy"></span>
          </div>
          <div class="message" id="message" aria-live="polite"></div>
        </div>
        <button type="button" class="roll-btn" id="rollBtn" data-i18n-aria="roll">
          <span class="die" id="die" aria-hidden="true"></span>
          <span class="roll-label" data-i18n="roll"></span>
        </button>
        <button type="button" class="power-btn" id="powerBtn" aria-haspopup="dialog"><span aria-hidden="true">⚡</span><span class="power-label" data-i18n="powers"></span><b class="power-count" id="powerCount">0</b></button>
        <button type="button" class="icon-btn" id="moreBtn" data-i18n-aria="more" data-i18n-title="more" aria-haspopup="dialog">☰</button>
      </div>
    </section>
  </main>

  <!-- Details drawer -->
  <div class="overlay drawer-overlay hidden" id="drawer">
    <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-head">
        <h2 id="drawerTitle" data-i18n="details"></h2>
        <button type="button" class="icon-btn" id="drawerClose" data-i18n-aria="close">✕</button>
      </div>
      <div class="card">
        <h3 data-i18n="players"></h3>
        <ol class="player-list" id="playerList"></ol>
      </div>
      <div class="card">
        <h3 data-i18n="legend"></h3>
        <ul class="legend" id="legend"></ul>
      </div>
      <div class="card log-card">
        <h3 data-i18n="log"></h3>
        <ol class="log" id="log"></ol>
      </div>
    </div>
  </div>

  <!-- Question -->
  <div class="overlay hidden" id="questionOverlay" role="dialog" aria-modal="true" aria-labelledby="qText">
    <div class="modal question-modal">
      <div class="q-head">
        <span class="topic-badge" id="qTopic"></span>
        <span class="q-meta"><span class="streak-badge" id="qStreak"></span><span class="diff-badge" id="qDiff"></span> <span class="q-house" id="qHouse"></span></span>
      </div>
      <div class="q-timer" id="qTimer"><span class="q-timer-bar"></span><b class="q-timer-num" id="qTimerNum"></b></div>
      <div class="q-player" id="qPlayer"></div>
      <p class="q-text" id="qText"></p>
      <div class="q-options" id="qOptions"></div>
      <div class="q-feedback" id="qFeedback" aria-live="assertive"></div>
      <div class="q-foot">
        <span class="hint" data-i18n="answerHint"></span>
        <button type="button" class="primary hidden" id="qContinue" data-i18n="continue"></button>
      </div>
    </div>
  </div>

  <!-- Powers -->
  <div class="overlay hidden" id="powerOverlay" role="dialog" aria-modal="true">
    <div class="modal power-modal" id="powerBody"></div>
  </div>

  <!-- Steal the question -->
  <div class="overlay hidden" id="stealOverlay" role="dialog" aria-modal="true">
    <div class="modal steal-modal" id="stealBody"></div>
  </div>

  <!-- Duel -->
  <div class="overlay hidden" id="duelOverlay" role="dialog" aria-modal="true">
    <div class="modal duel-modal" id="duelBody"></div>
  </div>

  <!-- Winner -->
  <div class="overlay hidden" id="winOverlay" role="dialog" aria-modal="true">
    <div class="modal win-modal">
      <div class="confetti" id="confetti" aria-hidden="true"></div>
      <div class="win-avatar" id="winAvatar"></div>
      <h2 data-i18n="winnerTitle"></h2>
      <p id="winText"></p>
      <div class="win-actions">
        <button type="button" class="primary big" id="rematchBtn" data-i18n="samePlayers"></button>
        <button type="button" class="ghost" id="playAgainBtn" data-i18n="playAgain"></button>
      </div>
    </div>
  </div>

  <!-- Rules -->
  <div class="overlay hidden" id="rulesOverlay" role="dialog" aria-modal="true">
    <div class="modal rules-modal">
      <h2 data-i18n="rulesTitle"></h2>
      <div id="rulesBody" class="rules-body"></div>
      <button type="button" class="primary" id="rulesClose" data-i18n="close"></button>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="fx" aria-hidden="true"></div>

  <script src="js/rules.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
